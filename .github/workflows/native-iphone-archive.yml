name: Manual signed iPhone archive
on:
  workflow_dispatch:
    inputs:
      export_method:
        description: Export only; this workflow never uploads to Apple
        type: choice
        default: app-store-connect
        options: [app-store-connect, release-testing]
permissions:
  contents: read
jobs:
  archive:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and export signed iPhone application
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: python3 native/tools/archive_iphone.py
      - name: Save IPA and source evidence
        uses: actions/upload-artifact@v4
        with:
          name: signed-iphone-${{ github.run_number }}
          path: |
            native/DeviceExport/*.ipa
            native/DeviceExport/build-evidence.json
          if-no-files-found: error
          retention-days: 7
